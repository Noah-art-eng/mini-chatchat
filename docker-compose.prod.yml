services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      MINI_CHATCHAT_DATA_ROOT: /app/backend/runtime/data
      MINI_CHATCHAT_UPLOADS_DIR: /app/backend/runtime/uploads
      MINI_CHATCHAT_DB_PATH: /app/backend/runtime/mini.db
      HF_HOME: /app/backend/runtime/model_cache
      SENTENCE_TRANSFORMERS_HOME: /app/backend/runtime/model_cache
    expose:
      - "8000"
    volumes:
      - ./runtime/prod:/app/backend/runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - mini-chatchat

  frontend:
    build:
      context: ./frontend-react
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - mini-chatchat

networks:
  mini-chatchat:
    driver: bridge
